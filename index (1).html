<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中垂線作圖</title><style>body{font:17px system-ui,sans-serif;background:#f4f6f5;color:#34433f;margin:0}main{max-width:900px;margin:20px auto;padding:20px;background:white;border-radius:16px}button,select{font:inherit;padding:9px 14px;border:1px solid #b8c9c1;border-radius:8px;background:white;color:#27634f;cursor:pointer}button.active{background:#27634f;color:white}svg{width:100%;max-height:58vh;background:#fff}input{width:100%;accent-color:#26836b}nav,footer{display:flex;gap:8px;flex-wrap:wrap}#desc{background:#f0f5f2;padding:15px;min-height:48px}small{color:#77847e}h1{font-size:24px} a{color:#27634f} .tile{display:block;border:1px solid #cbd9d1;border-radius:12px;padding:24px;margin:16px 0;text-decoration:none} .tile:hover{background:#f0f5f2} @media(max-width:600px){main{margin:0;padding:12px}button,select{padding:7px;font-size:14px}}</style><main><small>國二數學・第四冊　｜　怡甄老師編寫</small><h1>中垂線作圖</h1><nav><a href="../">尺規作圖總覽</a> · <a href="../../">動態教材首頁</a></nav><svg id="drawing" viewBox="-30 -65 700 490"></svg><div id="status"></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="作圖進度"><nav id="steps"></nav><p id="desc"></p><footer><button id="play">▶ 播放</button><button onclick="jump(-1)">上一步</button><button onclick="jump(1)">下一步</button><button onclick="set(0)">重置</button><select id="speed" aria-label="播放速度"><option value="0.5">0.5 倍速</option><option selected value="1">1 倍速</option><option value="1.5">1.5 倍速</option><option value="2">2 倍速</option></select><button onclick="document.fullscreenElement?document.exitFullscreen():document.querySelector('main').requestFullscreen?.()">全螢幕</button></footer></main><script>
const $=id=>document.getElementById(id), clamp=x=>Math.max(0,Math.min(1,x)), pi=Math.PI;let mode=0,p=0,running=false,last=0;const configs=[{cuts:[0,.12,.43,.74,.94,1],names:['已知線段','以 A 畫弧','以 B 畫弧','連接交點','完成'],desc:['已知線段 AB。','以 A 為圓心，取大於 AB 一半的半徑畫弧。','保持圓規開口不變，以 B 為圓心畫弧，交於 C、D。','以直尺連接 C、D。','CD 為 AB 的中垂線。']},{cuts:[0,.10,.31,.52,.73,.94,1],names:['已知角','以 O 畫弧','以 A 畫弧','以 B 畫弧','連接交點','完成'],desc:['已知 ∠XOY。','以 O 為圓心畫弧，交兩射線於 A、B。','以 A 為圓心，取適當半徑畫弧。','保持圓規開口不變，以 B 為圓心畫弧，取角內交點 C。','以直尺畫射線 OC。','OC 為 ∠XOY 的角平分線。']}];
function render(){let out='',c=configs[mode],i=c.cuts.findIndex((v,j)=>j<c.cuts.length-1&&p<c.cuts[j+1]);if(i<0)i=c.names.length-1;const f=clamp((p-c.cuts[i])/(c.cuts[i+1]-c.cuts[i]));const line=(a,b,col='#34433f',w=2)=>out+=`<path d="M${a} L${b}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;const dot=(a,n,dx=8,dy=-8)=>out+=`<circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="#34433f"/><text x="${a[0]+dx}" y="${a[1]+dy}" font-family="Times New Roman" font-size="19" fill="#34433f">${n}</text>`;const polar=(a,r,t)=>[a[0]+r*Math.cos(t),a[1]+r*Math.sin(t)];function compass(a,b){let dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),h=105,mid=[(a[0]+b[0])/2,(a[1]+b[1])/2],top=[mid[0]+dy/d*h,mid[1]-dx/d*h];line(a,top,'#a0aab1',7);line(b,top,'#697783',7);line(a,[a[0]+(top[0]-a[0])*.12,a[1]+(top[1]-a[1])*.12],'#374151',2);out+=`<circle cx="${top[0]}" cy="${top[1]}" r="8" fill="#c4cdd1" stroke="#697783"/>`}
function arc(a,r,start,end,k,col,tool){if(k<=0&&!tool)return;let b=polar(a,r,start),e=polar(a,r,start+(end-start)*k);if(k>0)out+=`<path d="M${b} A${r} ${r} 0 ${Math.abs((end-start)*k)>pi?1:0} ${end>start?1:0} ${e}" fill="none" stroke="${col}" stroke-width="2"/>`;if(tool)compass(a,e)}function draw(a,b,k){let e=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];line(a,e,'#26836b',3);if(k<1){let t=Math.atan2(b[1]-a[1],b[0]-a[0])*180/pi;out+=`<rect x="0" y="0" width="${Math.hypot(b[0]-a[0],b[1]-a[1])}" height="28" rx="3" fill="#a7c8d4" fill-opacity=".25" stroke="#9eb8c6" transform="translate(${a}) rotate(${t})"/>`}}
if(!mode){let A=[220,180],B=[420,180],r=145,h=Math.sqrt(r*r-10000),C=[320,180-h],D=[320,180+h],ang=Math.acos(100/r);line(A,B);dot(A,'A',-8,23);dot(B,'B',-5,23);if(i>=1)arc(A,r,-ang-.18,ang+.18,i===1?f:1,'#548eaf',i===1);if(i>=2)arc(B,r,pi-ang-.18,pi+ang+.18,i===2?f:1,'#c18c50',i===2);if(i>2||i===2&&f>=.18/(2*ang+.36))dot(D,'D');if(i>2||i===2&&f>=(2*ang+.18)/(2*ang+.36))dot(C,'C');if(i>=3)draw([320,45],[320,315],i===3?f:1);if(i===4){dot([320,180],'M',9,21);line([320,168],[332,168],'#26836b');line([332,168],[332,180],'#26836b');line([270,174],[270,186],'#26836b');line([370,174],[370,186],'#26836b')}}else{let O=[135,180],theta=.55,r=135,A=polar(O,r,-theta),B=polar(O,r,theta),R=110,C=[A[0]+Math.sqrt(R*R-(A[1]-180)**2),180];line(O,polar(O,380,-theta));line(O,polar(O,380,theta));dot(O,'O',-20,5);dot(polar(O,380,-theta),'X');dot(polar(O,380,theta),'Y');if(i>=1)arc(O,r,-theta-.12,theta+.12,i===1?f:1,'#548eaf',i===1);if(i>1||i===1&&f>.12/(2*theta+.24))dot(A,'A',-5,-10);if(i>1||i===1&&f>(2*theta+.12)/(2*theta+.24))dot(B,'B',-5,22);let a=Math.atan2(180-A[1],C[0]-A[0]);if(i>=2)arc(A,R,a-.55,a+.55,i===2?f:1,'#c18c50',i===2);if(i>=3)arc(B,R,-a-.55,-a+.55,i===3?f:1,'#c18c50',i===3);if(i>3||i===3&&f>=.5)dot(C,'C');if(i>=4)draw(O,[510,180],i===4?f:1);if(i===5){arc(O,48,-theta,0,1,'#26836b',false);arc(O,48,0,theta,1,'#26836b',false)}}$('drawing').innerHTML=out;$('seek').value=p*1000;$('status').textContent=`步驟 ${i+1} / ${c.names.length}　・　${Math.round(p*100)}%`;$('desc').textContent=c.desc[i];[...$('steps').children].forEach((b,j)=>b.classList.toggle('active',j===i));}
function set(x){p=clamp(x);render()}function choose(m){mode=m;running=false;$('play').textContent='▶ 播放';$('steps').innerHTML='';configs[m].names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>set(configs[m].cuts[i]);$('steps').append(b)});set(0)}function jump(d){let a=configs[mode].cuts;set(d>0?(a.find(x=>x>p+.0001)??1):([...a].reverse().find(x=>x<p-.0001)??0))}$('seek').oninput=e=>set(e.target.value/1000);$('play').onclick=()=>{if(p===1)set(0);running=!running;$('play').textContent=running?'Ⅱ 暫停':'▶ 播放'};function tick(t){if(running){set(p+Math.min(t-last,100)/16000*Number($('speed').value));if(p===1){running=false;$('play').textContent='▶ 播放'}}last=t;requestAnimationFrame(tick)}choose(0);requestAnimationFrame(tick);
</script></html>
