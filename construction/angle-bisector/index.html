<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角平分線作圖</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#344054;font:16px system-ui,"Microsoft JhengHei",sans-serif}aside{position:fixed;inset:0 auto 0 0;width:230px;background:#174c3d;color:white;padding:28px 20px;display:flex;flex-direction:column;gap:12px}aside strong{font-size:21px}aside a{color:#e2eee8;text-decoration:none;padding:12px;border-radius:8px}aside a:hover,aside a.current{background:#ffffff25}aside small{color:#b9d4c8;margin-top:auto}main{margin-left:230px;padding:30px;max-width:1450px}h1{font-size:28px;margin:10px 0 20px;color:#174c3d}small{color:#64748b}.panel{background:white;border:1px solid #dce5df;border-radius:18px;padding:20px;box-shadow:0 6px 24px #174c3d09}svg{width:100%;height:clamp(280px,52vh,620px);background:radial-gradient(#dce7e3 0.7px,transparent 0.7px) 0 0/20px 20px,#fcfefd;border-radius:12px}button,select{font:inherit;padding:9px 14px;border:1px solid #d3dfd9;border-radius:9px;background:white;color:#174c3d;cursor:pointer}button:hover{background:#e8f3ed}button.active,#play{background:#287a65;color:white}input{width:100%;accent-color:#287a65}nav,footer{display:flex;gap:8px;flex-wrap:wrap}#status{font-size:14px;color:#64748b;margin-top:10px}#desc{background:#eaf4ef;border-left:4px solid #49ad8b;padding:16px;border-radius:8px;min-height:56px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.tile{display:block;background:white;border:1px solid #dce5df;border-radius:16px;padding:22px;text-decoration:none;color:#174c3d;box-shadow:0 4px 16px #174c3d09}.tile:hover{transform:translateY(-2px)}.tile svg{height:150px}.hero{background:#e0eee6;padding:24px;border-radius:16px;margin-bottom:24px}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#64748b;margin:12px 0}.legend b{font-size:18px}@media(max-width:700px){aside{position:static;width:auto;padding:12px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px}aside strong{width:100%;font-size:18px}aside a{padding:6px;font-size:13px}aside small{display:none}main{margin:0;padding:12px}.panel{padding:10px}button,select{font-size:13px;padding:7px}h1{font-size:23px}svg{height:40vh;min-height:240px}}aside strong{padding-bottom:20px;border-bottom:1px solid #ffffff30}main{max-width:1100px}.panel{box-shadow:none;padding:16px}.panel svg{background:linear-gradient(#edf2ef55 1px,transparent 1px),linear-gradient(90deg,#edf2ef55 1px,transparent 1px),#fff;background-size:24px 24px;height:clamp(260px,52vh,560px)}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:#287a65}.panelhead button{border:0;padding:4px 8px}footer{align-items:center}#play{min-width:90px}#status{margin:0;margin-left:auto}#desc{background:white;border:0;border-radius:12px;margin:12px 0;padding:16px;line-height:1.65}#steps button{font-size:14px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));max-width:850px}.tile{padding:12px;box-shadow:none}.tile h2{font-size:17px;margin:10px 0}.tile svg{height:150px}.hero{display:flex;justify-content:space-between;align-items:center}.hero h2{margin:0 0 8px}.hero svg{width:110px;height:90px;background:none}.disabled{opacity:.85;cursor:default}.disabled:hover{transform:none}@media(max-width:700px){aside{position:fixed;width:115px;flex-direction:column;align-items:stretch;padding:12px 8px;gap:8px}aside strong{font-size:13px;padding-bottom:12px}aside a{font-size:12px}aside small{display:block;font-size:10px}main{margin-left:115px;padding:12px}h1{font-size:20px}.panel{padding:9px}.panel svg{height:clamp(190px,38vh,350px);min-height:0}.tile{padding:7px}.tile svg{height:85px;min-height:0}.tile h2{font-size:13px}.tiles{gap:8px}.hero{padding:12px}.hero svg{width:65px;height:65px;min-height:0}#steps button{font-size:11px;padding:5px}footer button,footer select{font-size:11px;padding:6px}#play{min-width:60px}}</style></head><body><aside><strong>數學動態教材</strong><a class="" href="../../">教材首頁</a><a class="" href="../../construction/">尺規作圖</a><a class="" href="../../construction/perpendicular-bisector/">中垂線作圖</a><a class="current" href="../../construction/angle-bisector/">角平分線作圖</a><small>怡甄老師｜數學教學</small></aside><main><small>國二數學 / 第四冊 / 尺規作圖</small><h1>角平分線作圖</h1><section class="panel"><div class="panelhead"><span>作圖演示</span><button aria-label="全螢幕" onclick="document.fullscreenElement?document.exitFullscreen():document.querySelector('main').requestFullscreen?.()">⛶</button></div><svg id="drawing" viewBox="-55 -95 750 550"></svg><input id="seek" type="range" min="0" max="1000" value="0" aria-label="作圖進度"><footer><button id="play">播放</button><button onclick="pause();set(0)">重置</button><select id="speed" aria-label="播放速度"><option value="0.5">0.5 倍速</option><option selected value="1">1 倍速</option><option value="1.5">1.5 倍速</option><option value="2">2 倍速</option></select><span id="status"></span></footer></section><p id="desc"></p><nav id="steps"></nav></main><script>
const $=id=>document.getElementById(id), clamp=x=>Math.max(0,Math.min(1,x)), pi=Math.PI;let mode=0,p=0,running=false,last=0;const configs=[{cuts:[0,.03125,.35,.67,.88,1],names:['已知線段','以 A 畫弧','以 B 畫弧','連接交點','完成'],desc:['已知線段 AB。','以 A 為圓心，取大於 AB 一半的半徑畫弧。','保持圓規開口不變，以 B 為圓心畫弧，交於 C、D。','以直尺連接 C、D。','CD 為 AB 的中垂線。']},{cuts:[0,.03125,.23,.44,.65,.88,1],names:['已知角','以 O 畫弧','以 A 畫弧','以 B 畫弧','連接交點','完成'],desc:['已知 ∠XOY。','以 O 為圓心畫弧，交兩射線於 A、B。','以 A 為圓心，取適當半徑畫弧。','保持圓規開口不變，以 B 為圓心畫弧，取角內交點 C。','以直尺畫射線 OC。','OC 為 ∠XOY 的角平分線。']}];
function render(){let out='',c=configs[mode],i=c.cuts.findIndex((v,j)=>j<c.cuts.length-1&&p<c.cuts[j+1]);if(i<0)i=c.names.length-1;const f=clamp((p-c.cuts[i])/(c.cuts[i+1]-c.cuts[i]));const line=(a,b,col='#34433f',w=2)=>out+=`<path d="M${a} L${b}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;const dot=(a,n,dx=8,dy=-8)=>out+=`<circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="#34433f"/><text x="${a[0]+dx}" y="${a[1]+dy}" font-family="Times New Roman" font-size="19" fill="#34433f">${n}</text>`;const polar=(a,r,t)=>[a[0]+r*Math.cos(t),a[1]+r*Math.sin(t)];function compass(a,b){let dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),h=105,mid=[(a[0]+b[0])/2,(a[1]+b[1])/2],top=[mid[0]+dy/d*h,mid[1]-dx/d*h];line(a,top,'#536675',11);line(b,top,'#536675',11);line(a,top,'#cbd5df',7);line(b,top,'#94a6b8',7);line(a,top,'#eef3f7',2);out+=`<circle cx="${a[0]}" cy="${a[1]}" r="10" fill="#4B91D1" opacity=".14"/>`; line(a,[a[0]+(top[0]-a[0])*.12,a[1]+(top[1]-a[1])*.12],'#374151',2);out+=`<circle cx="${top[0]}" cy="${top[1]}" r="8" fill="#c4cdd1" stroke="#697783"/>`}
function arc(a,r,start,end,k,col,tool){if(k<=0&&!tool)return;let b=polar(a,r,start),e=polar(a,r,start+(end-start)*k);if(k>0)out+=`<path d="M${b} A${r} ${r} 0 ${Math.abs((end-start)*k)>pi?1:0} ${end>start?1:0} ${e}" fill="none" stroke="${col}" stroke-width="2"/>`;if(tool)compass(a,e)}function draw(a,b,k){let e=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];line(a,e,'#26836b',3);if(k<1){let t=Math.atan2(b[1]-a[1],b[0]-a[0])*180/pi;out+=`<rect x="0" y="0" width="${Math.hypot(b[0]-a[0],b[1]-a[1])}" height="28" rx="3" fill="#a7c8d4" fill-opacity=".25" stroke="#9eb8c6" transform="translate(${a}) rotate(${t})"/>`}}
if(!mode){let A=[220,180],B=[420,180],r=145,h=Math.sqrt(r*r-10000),C=[320,180-h],D=[320,180+h],ang=Math.acos(100/r);line(A,B);dot(A,'A',-8,23);dot(B,'B',-5,23);if(i>=1)arc(A,r,-ang-.18,ang+.18,i===1?f:1,'#4B91D1',i===1);if(i>=2)arc(B,r,pi-ang-.18,pi+ang+.18,i===2?f:1,'#EDA653',i===2);if(i>2||i===2&&f>=.18/(2*ang+.36))dot(D,'D');if(i>2||i===2&&f>=(2*ang+.18)/(2*ang+.36))dot(C,'C');if(i>=3)draw([320,45],[320,315],i===3?f:1);if(i===4){dot([320,180],'M',9,21);line([320,168],[332,168],'#26836b');line([332,168],[332,180],'#26836b');line([270,174],[270,186],'#26836b');line([370,174],[370,186],'#26836b')}}else{let O=[135,180],theta=.55,r=135,A=polar(O,r,-theta),B=polar(O,r,theta),R=110,C=[A[0]+Math.sqrt(R*R-(A[1]-180)**2),180];line(O,polar(O,380,-theta));line(O,polar(O,380,theta));dot(O,'O',-20,5);dot(polar(O,380,-theta),'X');dot(polar(O,380,theta),'Y');if(i>=1)arc(O,r,-theta-.12,theta+.12,i===1?f:1,'#4B91D1',i===1);if(i>1||i===1&&f>.12/(2*theta+.24))dot(A,'A',-5,-10);if(i>1||i===1&&f>(2*theta+.12)/(2*theta+.24))dot(B,'B',-5,22);let a=Math.atan2(180-A[1],C[0]-A[0]);if(i>=2)arc(A,R,a-.55,a+.55,i===2?f:1,'#EDA653',i===2);if(i>=3)arc(B,R,-a-.55,-a+.55,i===3?f:1,'#9676C8',i===3);if(i>3||i===3&&f>=.5)dot(C,'C');if(i>=4)draw(O,[510,180],i===4?f:1);if(i===5){for(let [u,v,col] of [[-theta,0,'#4B91D1'],[0,theta,'#9676C8']]){out+=`<path d="M${O} L${polar(O,48,u)} A48 48 0 0 1 ${polar(O,48,v)} Z" fill="${col}" opacity=".22"/>`}arc(O,48,-theta,0,1,'#26836b',false);arc(O,48,0,theta,1,'#26836b',false)}}$('drawing').innerHTML=out;$('seek').value=p*1000;$('status').textContent=`步驟 ${i+1} / ${c.names.length}　・　${Math.round(p*100)}%`;$('desc').textContent=String(i+1).padStart(2,'0')+'　'+c.names[i]+'｜'+c.desc[i];[...$('steps').children].forEach((b,j)=>b.classList.toggle('active',j===i));}
function set(x){p=clamp(x);render()}function choose(m){mode=m;running=false;$('play').textContent='▶ 播放';$('steps').innerHTML='';configs[m].names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{pause();set(configs[m].cuts[i])};$('steps').append(b)});set(0)}function jump(d){pause();let a=configs[mode].cuts;set(d>0?(a.find(x=>x>p+.0001)??1):([...a].reverse().find(x=>x<p-.0001)??0))}function pause(){running=false;$('play').textContent='▶ 播放'}$('seek').onpointerdown=pause;$('seek').oninput=e=>{pause();set(e.target.value/1000)};$('play').onclick=()=>{if(p===1)set(0);running=!running;$('play').textContent=running?'Ⅱ 暫停':'▶ 播放'};function tick(t){if(running){set(p+Math.min(t-last,100)/16000*Number($('speed').value));if(p===1){set(0)}}last=t;requestAnimationFrame(tick)}choose(1);running=true;$('play').textContent='Ⅱ 暫停';requestAnimationFrame(tick);
</script></body></html>
